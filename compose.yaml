services:
  nuvio-bridge:
    build: .
    image: nuvio-aio-bridge:latest
    container_name: nuvio-bridge
    restart: unless-stopped
    # The bridge holds everything in memory and writes nothing to disk, so the
    # root filesystem is read-only and only /tmp is writable. It binds 8080
    # (above 1024) and runs as nonroot, so it needs no capabilities at all.
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # The app's graceful shutdown budget is 10s; leave margin before SIGKILL.
    stop_grace_period: 15s
    # Bound the json-file logs so a long-running bridge cannot fill the disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # No published ports: AIOStreams reaches the bridge by container name on
    # the shared Docker network. Attach the network AIOStreams uses.
    expose:
      - "8080"
    environment:
      NUVIO_EMAIL: ${NUVIO_EMAIL}
      NUVIO_PASSWORD: ${NUVIO_PASSWORD}
      NUVIO_PROFILE: ${NUVIO_PROFILE}
      NUVIO_API_URL: ${NUVIO_API_URL:-https://api.nuvio.tv}
      NUVIO_ANON_KEY: ${NUVIO_ANON_KEY:-sb_publishable_1Clq8rlTVACkdcZuqr6_AD__xUUC_EN}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      TMDB_BASE_URL: ${TMDB_BASE_URL:-https://api.themoviedb.org/3}
      METADATA_URL: ${METADATA_URL:-https://v3-cinemeta.strem.io}
      BRIDGE_TOKEN: ${BRIDGE_TOKEN}
      PORT: "8080"
    networks:
      - aiostreams

# The bridge joins the existing network AIOStreams already uses, so AIOStreams
# reaches it by container name with no published ports.
#
# Find the name on the VPS with:
#   docker inspect -f '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{"\n"}}{{end}}' <aiostreams_container>
# then set AIO_NETWORK to that name (e.g. aiostreams_default).
networks:
  aiostreams:
    external: true
    name: ${AIO_NETWORK:-aiostreams}
